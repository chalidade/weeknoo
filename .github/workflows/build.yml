name: Build sites

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Enumerate sites/* so new sites are picked up automatically.
  discover:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "sites=$(ls sites | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    name: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/${{ matrix.site }}/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: sites/${{ matrix.site }}
        run: npm ci

      # Runs the same flow as locally: web build → Capacitor sync → Gradle APK.
      # The runner ships with the Android SDK preinstalled (ANDROID_HOME is set).
      - name: Build web + APK
        run: bash scripts/build-apk.sh ${{ matrix.site }}

      - name: Upload web build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.site }}-web
          path: sites/${{ matrix.site }}/dist
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.site }}-apk
          path: sites/${{ matrix.site }}/${{ matrix.site }}-debug.apk
          retention-days: 30

  # Publish every site to GitHub Pages:
  #   https://chalidade.github.io/weeknoo/<site>/
  # Sites are rebuilt with --base so assets resolve under the sub-path;
  # local builds and the APK flow keep the default base.
  pages:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build all sites for Pages
        run: |
          mkdir -p _pages
          for site in $(ls sites); do
            (cd "sites/$site" && npm ci && npx vite build --base="/weeknoo/$site/")
            cp -r "sites/$site/dist" "_pages/$site"
          done
          {
            echo '<!doctype html><html lang="en"><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>weeknoo</title>'
            echo '<body style="font-family:system-ui;max-width:40rem;margin:4rem auto;padding:0 1rem">'
            echo '<h1>weeknoo sites</h1><ul>'
            for site in $(ls sites); do
              echo "<li><a href=\"./$site/\">$site</a></li>"
            done
            echo '</ul></body></html>'
          } > _pages/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v5
